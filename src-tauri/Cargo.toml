[package]
name = "netbox-explorer"
version = "0.2.0"
description = "NetBox Explorer: a read-only desktop frontend for any NetBox instance"
edition = "2021"
publish = false

[lib]
name = "netbox_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Requests to NetBox are made here (no CORS). native-tls uses the operating system's certificate store (the macOS
# Keychain), so certificates trusted there work; dangerous-settings allows the per-server "self-signed" option.
tauri-plugin-http = { version = "2", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "gzip", "dangerous-settings"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
